<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RETRO WAVE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HERO -->
  <header class="hero">
    <div class="grid-bg"></div>
    <div class="hero-inner">
      <img id="logo" src="" alt="logo" class="logo" onerror="this.style.display='none'">
      <div class="badge" id="ticker">$RETRO</div>
      <h1 id="hero-title">The Future is Neon</h1>
      <p id="tagline">Ride the neon wave to the moon</p>
      <div class="cta-group">
        <a id="buy-link" href="#" class="btn-primary">BUY NOW</a>
        <a id="dex-link" href="#" class="btn-outline">DEXSCREENER</a>
      </div>
    </div>
    <div class="sun"></div>
  </header>

  <!-- ABOUT -->
  <section class="section">
    <h2 class="section-title">About</h2>
    <p id="about" class="section-text"></p>
  </section>

  <!-- TOKENOMICS -->
  <section class="section dark-section">
    <h2 class="section-title">Tokenomics</h2>
    <div class="toka-grid">
      <div class="toka-card">
        <div class="toka-label">Total Supply</div>
        <div class="toka-value" id="total-supply">—</div>
      </div>
      <div class="toka-card">
        <div class="toka-label">Buy Tax</div>
        <div class="toka-value" id="buy-tax">—</div>
      </div>
      <div class="toka-card">
        <div class="toka-label">Sell Tax</div>
        <div class="toka-value" id="sell-tax">—</div>
      </div>
      <div class="toka-card">
        <div class="toka-label">LP Lock</div>
        <div class="toka-value" id="lp-lock">—</div>
      </div>
    </div>
  </section>

  <!-- ROADMAP -->
  <section class="section">
    <h2 class="section-title">Roadmap</h2>
    <div class="roadmap" id="roadmap"></div>
  </section>

  <!-- HOW TO BUY -->
  <section class="section dark-section">
    <h2 class="section-title">How to Buy</h2>
    <p id="how-to-buy" class="section-text"></p>
  </section>

  <!-- SOCIALS -->
  <footer class="footer">
    <div class="socials" id="socials"></div>
    <p class="disclaimer" id="disclaimer"></p>
    <div class="built-with">Built with <a href="https://anvl.site">ANVL</a></div>
  </footer>

  <!-- ANVL_DATA injected by platform -->
  <script src="template.js"></script>
</body>
</html>
